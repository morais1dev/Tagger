# Roda a suíte de testes a cada push e pull request para main.
# Sem Secrets e sem rede: os testes de rede usam respostas simuladas e a interface roda sem tela (offscreen).
name: Testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"        # a mesma do release.yml
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Testes
        run: python -m pytest -q
